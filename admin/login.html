<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Auto Club</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <main class="admin-login">

        <section class="login-box">

            <h1>Auto Club</h1>

            <p>
                Acesso administrativo
            </p>

            <form id="formLogin">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        required
                    >

                </div>

                <button
                    type="submit"
                    id="btnLogin"
                >
                    Entrar
                </button>

                <p
                    id="mensagemErro"
                    class="mensagem-erro"
                ></p>

            </form>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="./admin.js"></script>

</body>

</html>
